<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-labelledby="title"><title id="title">Hidden representation passes through an output mapping to prediction</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#89d9ef"/></marker></defs><g font-family="system-ui, sans-serif"><text x="20" y="25" fill="#89d9ef" font-size="14" text-anchor="start">INTERNAL COMPUTATION</text><rect x="60" y="60" width="380" height="60" fill="#08121a" stroke="#89d9ef"/><text x="250.0" y="95.0" fill="#89d9ef" font-size="15" text-anchor="middle">Hidden representation</text><path d="M250 120 L250 157" stroke="#89d9ef" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="60" y="164" width="380" height="60" fill="#08121a" stroke="#89d9ef"/><text x="250.0" y="199.0" fill="#89d9ef" font-size="15" text-anchor="middle">Output mapping</text><path d="M250 224 L250 261" stroke="#89d9ef" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="60" y="268" width="380" height="60" fill="#08121a" stroke="#e4b95e"/><text x="250.0" y="303.0" fill="#e4b95e" font-size="15" text-anchor="middle">Prediction</text><text x="250" y="393" fill="#a5b7bf" font-size="14" text-anchor="middle">Changing state is not the same as emitting an answer.</text></g></svg>