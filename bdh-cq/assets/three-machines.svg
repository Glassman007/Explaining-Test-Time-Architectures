<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-labelledby="title"><title id="title">Computational structures of Transformer, BDH and HRM</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#89d9ef"/></marker></defs><g font-family="system-ui, sans-serif"><text x="20" y="28" fill="#89d9ef" font-size="14" text-anchor="start">TRANSFORMER</text><text x="260" y="28" fill="#e4b95e" font-size="14" text-anchor="start">BDH / BDH-CQ</text><rect x="20" y="52" width="205" height="42" fill="#08121a" stroke="#89d9ef"/><text x="122.5" y="78.0" fill="#89d9ef" font-size="15" text-anchor="middle">Input representations</text><path d="M123 94 L123 118" stroke="#89d9ef" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="20" y="122" width="205" height="42" fill="#08121a" stroke="#89d9ef"/><text x="122.5" y="148.0" fill="#89d9ef" font-size="15" text-anchor="middle">Self-attention</text><path d="M123 164 L123 188" stroke="#89d9ef" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="20" y="192" width="205" height="42" fill="#08121a" stroke="#89d9ef"/><text x="122.5" y="218.0" fill="#89d9ef" font-size="15" text-anchor="middle">Feed-forward</text><path d="M123 234 L123 258" stroke="#89d9ef" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="20" y="262" width="205" height="42" fill="#08121a" stroke="#89d9ef"/><text x="122.5" y="288.0" fill="#89d9ef" font-size="15" text-anchor="middle">Updated representation</text><rect x="260" y="52" width="220" height="48" fill="#08121a" stroke="#e4b95e"/><text x="370.0" y="81.0" fill="#e4b95e" font-size="15" text-anchor="middle">Positive activations</text><path d="M370 100 L370 124" stroke="#89d9ef" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="260" y="124" width="220" height="55" fill="#08121a" stroke="#e4b95e"/><text x="370.0" y="156.5" fill="#e4b95e" font-size="15" text-anchor="middle">Associative state</text><path d="M370 179 L370 207" stroke="#89d9ef" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="260" y="207" width="220" height="55" fill="#08121a" stroke="#e4b95e"/><text x="370.0" y="239.5" fill="#e4b95e" font-size="15" text-anchor="middle">Low-rank interaction</text><path d="M480 151 L492 151 L492 234 L481 234" fill="none" stroke="#e4b95e" stroke-width="2"/><text x="260" y="296" fill="#a5b7bf" font-size="13" text-anchor="start">State can evolve; trained θ is fixed.</text><text x="20" y="337" fill="#89d9ef" font-size="14" text-anchor="start">HRM</text><rect x="95" y="320" width="170" height="48" fill="#08121a" stroke="#e4b95e"/><text x="180.0" y="349.0" fill="#e4b95e" font-size="15" text-anchor="middle">H · slower updates</text><rect x="300" y="320" width="180" height="48" fill="#08121a" stroke="#89d9ef"/><text x="390.0" y="349.0" fill="#89d9ef" font-size="15" text-anchor="middle">L · faster updates</text><path d="M270 338 L295 338" stroke="#89d9ef" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M295 352 L270 352" stroke="#89d9ef" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="20" y="407" fill="#a5b7bf" font-size="13" text-anchor="start">Schematic roles; not a complete implementation.</text></g></svg>