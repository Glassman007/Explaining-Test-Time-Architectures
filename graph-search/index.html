<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05090e"><title>Graph Search — Thought Web</title><link rel="stylesheet" href="thought-web.css"><link rel="stylesheet" href="../lesson-entry.css"></head><body><main class="game-shell"><header class="game-header"><a class="back-link" href="../search/index.html" aria-label="Back">←</a><div class="brand-block"><p class="eyebrow">GRAPH SEARCH</p><h1>Thought Web</h1></div><div class="budget-block"><span class="budget-label">CHIPS</span><strong id="chipCount">10</strong><div id="chipRow" class="chip-row"></div></div></header><div class="challenge-bar"><p>Design a campaign to get more students interested in learning AI.</p><div class="selected-readout"><span>Selected</span><strong id="selectedReadout"></strong></div></div><div class="play-layout"><aside class="operations-panel"><div class="panel-heading"><span>Operations</span></div><button class="op-button" data-op="branch"><span class="op-icon">⑂</span><span><strong>Branch</strong><small>1 chip</small></span></button><button class="op-button" data-op="merge"><span class="op-icon">⋈</span><span><strong>Merge</strong><small>2 chips</small></span></button><button class="op-button" data-op="reuse"><span class="op-icon">↗</span><span><strong>Reuse</strong><small>Free</small></span></button><button class="op-button" data-op="feedback"><span class="op-icon">↻</span><span><strong>Feedback</strong><small>1 chip</small></span></button><p id="modeHint"></p></aside><section class="canvas-panel"><div class="canvas-toolbar"><span id="canvasStatus"></span><span>Drag nodes · Scroll to explore</span></div><div id="canvasViewport" class="canvas-viewport"><div id="graphStage" class="graph-stage"><svg id="edgeLayer" class="edge-layer"></svg><div id="nodeLayer" class="node-layer"></div></div></div></section><aside class="score-panel"><div class="panel-heading"><span>Evaluate</span><small id="scoreTarget"></small></div><label class="score-field">Relevance <output id="relevanceOut">3</output><input id="relevance" type="range" min="1" max="5" value="3"></label><label class="score-field">Novelty <output id="noveltyOut">3</output><input id="novelty" type="range" min="1" max="5" value="3"></label><label class="score-field">Coherence <output id="coherenceOut">3</output><input id="coherence" type="range" min="1" max="5" value="3"></label><button id="scoreButton" class="score-button">Score · 1 chip</button><button id="finalButton" class="final-button">Submit final node</button><h3 class="history-title">History <span id="moveCount">0</span></h3><ol id="historyList"></ol></aside></div></main><section id="composer" class="composer" hidden><div class="composer-card"><button id="composerClose" class="composer-close" aria-label="Close">×</button><p id="composerEyebrow" class="eyebrow"></p><h2 id="composerTitle"></h2><p id="composerCopy"></p><div id="composerBody"></div><button id="composerConfirm" class="composer-confirm">Create</button></div></section><section id="finalScreen" class="final-screen" hidden><div class="final-card"><p class="eyebrow">FINAL NODE</p><h2 id="finalScore"></h2><p id="finalNodeText"></p><div id="finalMetrics"></div><p id="finalFormula"></p><button id="restartButton">Restart</button><a href="../inference-strategy/index.html">Back to inference</a></div></section><script src="thought-web.js"></script><script src="../navigation.js"></script></body></html>
